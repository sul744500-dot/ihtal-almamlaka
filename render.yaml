# موقع ثابت على Render (مجاني ولا ينام): اللعبة كلها تعمل في المتصفح
# خادم المزامنة (relay) للاستخدام المحلي فقط ولا يُنشر هنا
services:
  - type: web
    name: ihtal-almamlaka
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # عامل الخدمة (PWA) يجب ألا يُخزَّن مؤقتًا حتى تصل التحديثات فورًا
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
